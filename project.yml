name: iJIRA
options:
  bundleIdPrefix: de.entrecode
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Fallback für lokale Xcode-Builds — Releases überschreiben beides aus
    # Git (scripts/notarize.sh); Bump via scripts/release.sh.
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: de.entrecode.iJIRA
    # Manuelles Developer-ID-Signing für ALLE Builds → stabile Identität
    # (Keychain-Erlaubnis überlebt Rebuilds), kein Xcode-Login nötig und
    # identisch mit der notarisierten Release-Signatur.
    DEVELOPMENT_TEAM: MAMAYY5H8H
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    ENABLE_HARDENED_RUNTIME: YES

targets:
  iJIRA:
    type: application
    platform: macOS
    sources:
      - path: iJIRA
    dependencies:
      - package: Sparkle
    info:
      path: iJIRA/Info.plist
      properties:
        CFBundleDisplayName: iJIRA
        CFBundleName: iJIRA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        # App-Icon (Dock/Cmd-Tab/Finder) — erzeugt via scripts/generate-icon.swift
        CFBundleIconFile: AppIcon
        # Deep-Link: ijira://issue/ONE-1234 öffnet das Issue-Fenster
        CFBundleURLTypes:
          - CFBundleURLName: de.entrecode.iJIRA.issue
            CFBundleURLSchemes:
              - ijira
        # Damit App Transport Security nur HTTPS erlaubt (Default ist ohnehin streng)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Sparkle-Auto-Update. Der appcast ist eine statische Datei im
        # öffentlichen Repo — kein eigener Updateserver. SUPublicEDKey trägt
        # scripts/sparkle-setup.sh einmalig ein; der zugehörige PRIVATE
        # Schlüssel liegt in der Keychain und muss gesichert werden (ohne ihn
        # akzeptiert keine installierte App je wieder ein Update).
        SUFeedURL: https://raw.githubusercontent.com/entrecode/iJIRA/main/appcast.xml
        SUPublicEDKey: "937PkJCk5GCARK/FCzsDL8Qeemvojw4t8L644n9sIpA="
        # Ohne diesen Schlüssel fragt Sparkle beim ersten Start nach; für ein
        # internes Tool ist „an" die sinnvollere Vorgabe (abschaltbar in den
        # Einstellungen).
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: iJIRA
        GENERATE_INFOPLIST_FILE: NO
