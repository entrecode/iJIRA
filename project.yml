name: iJIRA
options:
  bundleIdPrefix: de.entrecode
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Fallback für lokale Xcode-Builds — Releases überschreiben beides aus
    # Git (scripts/notarize.sh); Bump via scripts/release.sh.
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: de.entrecode.iJIRA
    # Manuelles Developer-ID-Signing für ALLE Builds → stabile Identität
    # (Keychain-Erlaubnis überlebt Rebuilds), kein Xcode-Login nötig und
    # identisch mit der notarisierten Release-Signatur.
    DEVELOPMENT_TEAM: MAMAYY5H8H
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    ENABLE_HARDENED_RUNTIME: YES

targets:
  iJIRA:
    type: application
    platform: macOS
    sources:
      - path: iJIRA
    info:
      path: iJIRA/Info.plist
      properties:
        # Menüleisten-Agent: kein Dock-Icon, kein Hauptfenster beim Start
        LSUIElement: true
        CFBundleDisplayName: iJIRA
        CFBundleName: iJIRA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        # App-Icon (Dock/Cmd-Tab/Finder) — erzeugt via scripts/generate-icon.swift
        CFBundleIconFile: AppIcon
        # Deep-Link: ijira://issue/ONE-1234 öffnet das Issue-Fenster
        CFBundleURLTypes:
          - CFBundleURLName: de.entrecode.iJIRA.issue
            CFBundleURLSchemes:
              - ijira
        # Damit App Transport Security nur HTTPS erlaubt (Default ist ohnehin streng)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_NAME: iJIRA
        GENERATE_INFOPLIST_FILE: NO
